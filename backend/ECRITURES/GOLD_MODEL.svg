<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" font-family="Consolas, monospace" font-size="13">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#666"/>
    </marker>
    <filter id="shadow">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.1"/>
    </filter>
  </defs>

  <!-- Title -->
  <text x="600" y="35" text-anchor="middle" font-size="20" font-weight="bold" fill="#2e4741">Gold Layer — Star Schema</text>
  <line x1="200" y1="50" x2="1000" y2="50" stroke="#2e4741" stroke-width="2"/>

  <!-- ===== DIM_AGENCES ===== -->
  <rect x="40" y="100" width="260" height="260" rx="8" fill="#e0f2e9" stroke="#2e4741" stroke-width="2" filter="url(#shadow)"/>
  <rect x="40" y="100" width="260" height="32" rx="8" fill="#2e4741"/>
  <rect x="40" y="124" width="260" height="8" fill="#2e4741"/>
  <text x="170" y="122" text-anchor="middle" font-size="14" font-weight="bold" fill="white">dim_agences</text>
  <text x="60" y="155" font-size="12" fill="#666">PK id VARCHAR(50)</text>
  <line x1="60" y1="162" x2="280" y2="162" stroke="#ddd"/>
  <text x="60" y="180" font-size="12" fill="#333">nom VARCHAR(100)</text>
  <text x="60" y="200" font-size="12" fill="#333">ville VARCHAR(50)</text>
  <text x="60" y="220" font-size="12" fill="#333">region VARCHAR(50)</text>
  <text x="60" y="240" font-size="12" fill="#333">directeur VARCHAR(100)</text>
  <text x="60" y="260" font-size="12" fill="#333">telephone VARCHAR(20)</text>
  <text x="60" y="280" font-size="12" fill="#333">email VARCHAR(100)</text>
  <text x="60" y="300" font-size="12" fill="#999">is_valid BOOLEAN</text>
  <text x="60" y="320" font-size="12" fill="#999">error_message TEXT</text>
  <text x="60" y="340" font-size="12" fill="#999">ingested_at TIMESTAMP</text>

  <!-- ===== DIM_CLIENTS ===== -->
  <rect x="880" y="100" width="280" height="300" rx="8" fill="#e0f2e9" stroke="#2e4741" stroke-width="2" filter="url(#shadow)"/>
  <rect x="880" y="100" width="280" height="32" rx="8" fill="#2e4741"/>
  <rect x="880" y="124" width="280" height="8" fill="#2e4741"/>
  <text x="1020" y="122" text-anchor="middle" font-size="14" font-weight="bold" fill="white">dim_clients</text>
  <text x="900" y="155" font-size="12" fill="#666">PK id VARCHAR(50)</text>
  <line x1="900" y1="162" x2="1140" y2="162" stroke="#ddd"/>
  <text x="900" y="180" font-size="12" fill="#333">nom VARCHAR(100)</text>
  <text x="900" y="200" font-size="12" fill="#333">segment VARCHAR(50)</text>
  <text x="900" y="220" font-size="12" fill="#333">encours DECIMAL(15,2)</text>
  <text x="900" y="240" font-size="12" fill="#333">score INTEGER</text>
  <text x="900" y="260" font-size="12" fill="#333">statut VARCHAR(50)</text>
  <text x="900" y="280" font-size="12" fill="#333">email VARCHAR(100)</text>
  <text x="900" y="300" font-size="12" fill="#333">telephone VARCHAR(20)</text>
  <text x="900" y="320" font-size="12" fill="#999">is_valid BOOLEAN</text>
  <text x="900" y="340" font-size="12" fill="#999">error_message TEXT</text>
  <text x="900" y="360" font-size="12" fill="#999">ingested_at TIMESTAMP</text>

  <!-- ===== DIM_DATE ===== -->
  <rect x="420" y="440" width="220" height="170" rx="8" fill="#e0f2e9" stroke="#2e4741" stroke-width="2" filter="url(#shadow)"/>
  <rect x="420" y="440" width="220" height="32" rx="8" fill="#2e4741"/>
  <rect x="420" y="464" width="220" height="8" fill="#2e4741"/>
  <text x="530" y="462" text-anchor="middle" font-size="14" font-weight="bold" fill="white">dim_date</text>
  <text x="440" y="495" font-size="12" fill="#666">PK date_id DATE</text>
  <line x1="440" y1="502" x2="620" y2="502" stroke="#ddd"/>
  <text x="440" y="520" font-size="12" fill="#333">date DATE</text>
  <text x="440" y="540" font-size="12" fill="#333">jour INTEGER</text>
  <text x="440" y="560" font-size="12" fill="#333">mois INTEGER</text>
  <text x="440" y="580" font-size="12" fill="#333">trimestre INTEGER</text>
  <text x="440" y="600" font-size="12" fill="#333">annee INTEGER</text>

  <!-- ===== FACT_ENGAGEMENTS ===== -->
  <rect x="300" y="180" width="460" height="230" rx="8" fill="#fef2e6" stroke="#d33b21" stroke-width="2" filter="url(#shadow)"/>
  <rect x="300" y="180" width="460" height="32" rx="8" fill="#d33b21"/>
  <rect x="300" y="204" width="460" height="8" fill="#d33b21"/>
  <text x="530" y="202" text-anchor="middle" font-size="14" font-weight="bold" fill="white">fact_engagements</text>
  <text x="320" y="235" font-size="12" fill="#666">PK ref VARCHAR(50)</text>
  <line x1="320" y1="242" x2="740" y2="242" stroke="#ddd"/>
  <text x="320" y="260" font-size="12" fill="#d33b21" font-weight="bold">FK client_id → dim_clients</text>
  <text x="320" y="280" font-size="12" fill="#d33b21" font-weight="bold">FK agence_id → dim_agences</text>
  <text x="320" y="300" font-size="12" fill="#d33b21" font-weight="bold">FK date_id → dim_date</text>
  <line x1="320" y1="308" x2="740" y2="308" stroke="#ddd"/>
  <text x="320" y="326" font-size="12" fill="#333">client_nom VARCHAR(100)</text>
  <text x="320" y="346" font-size="12" fill="#333">type_credit VARCHAR(50)</text>
  <text x="320" y="366" font-size="12" fill="#333">montant DECIMAL(15,2)</text>
  <text x="320" y="386" font-size="12" fill="#333">duree INTEGER</text>
  <text x="320" y="406" font-size="12" fill="#333">taux DECIMAL(5,2)</text>
  <text x="540" y="346" font-size="12" fill="#333">score INTEGER</text>
  <text x="540" y="366" font-size="12" fill="#333">statut VARCHAR(50)</text>

  <!-- ===== ARROWS dim_agences → fact ===== -->
  <line x1="300" y1="270" x2="310" y2="280" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="300" y1="250" x2="310" y2="260" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>
  <!-- Arrow dim_clients → fact -->
  <line x1="880" y1="170" x2="760" y2="260" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="880" y1="190" x2="760" y2="280" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>
  <!-- Arrow dim_date → fact -->
  <line x1="530" y1="440" x2="530" y2="410" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Labels on arrows -->
  <text x="280" y="245" font-size="11" fill="#666" text-anchor="end">agence_id</text>
  <text x="800" y="245" font-size="11" fill="#666">client_id</text>
  <text x="540" y="432" font-size="11" fill="#666" text-anchor="end">date_id</text>

  <!-- ===== INSTRUCTION BOX ===== -->
  <rect x="40" y="440" width="300" height="150" rx="8" fill="#f8f4f0" stroke="#d33b21" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="190" y="470" text-anchor="middle" font-size="13" font-weight="bold" fill="#d33b21">INSERT dans les tables API</text>
  <line x1="60" y1="480" x2="320" y2="480" stroke="#ddd"/>
  <text x="60" y="500" font-size="12" fill="#333">silver_clients (valides)</text>
  <text x="80" y="520" font-size="12" fill="#666">→ INSERT INTO clients</text>
  <text x="60" y="545" font-size="12" fill="#333">silver_agences (valides)</text>
  <text x="80" y="565" font-size="12" fill="#666">→ INSERT INTO agences</text>
  <text x="60" y="590" font-size="12" fill="#333">silver_engagements (valides)</text>
  <text x="80" y="610" font-size="12" fill="#666">→ INSERT INTO engagements</text>
  <text x="60" y="635" font-size="12" fill="#333">silver_users (valides)</text>
  <text x="80" y="655" font-size="12" fill="#666">→ INSERT INTO users</text>

  <!-- ===== LEGEND ===== -->
  <rect x="820" y="460" width="340" height="140" rx="8" fill="#f8f4f0" stroke="#ccc" stroke-width="1"/>
  <text x="990" y="485" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">A faire par toi</text>
  <line x1="835" y1="495" x2="1145" y2="495" stroke="#ddd"/>
  <text x="840" y="515" font-size="12" fill="#333">1. Lire silver_* (is_valid = true)</text>
  <text x="840" y="537" font-size="12" fill="#333">2. Nettoyer/normaliser si besoin</text>
  <text x="840" y="559" font-size="12" fill="#333">3. INSERT dans les tables API</text>
  <text x="840" y="581" font-size="12" fill="#333">4. Créer dim_date si pas existante</text>
  <text x="840" y="603" font-size="12" fill="#333">5. Créer agg_kpis si besoin frontend</text>

  <!-- Color legend -->
  <rect x="40" y="680" width="18" height="18" rx="3" fill="#e0f2e9" stroke="#2e4741"/>
  <text x="65" y="694" font-size="12" fill="#333">= Dimension table</text>
  <rect x="200" y="680" width="18" height="18" rx="3" fill="#fef2e6" stroke="#d33b21"/>
  <text x="225" y="694" font-size="12" fill="#333">= Fact table</text>
  <rect x="350" y="680" width="18" height="18" rx="3" fill="#f8f4f0" stroke="#d33b21" stroke-dasharray="3,2"/>
  <text x="375" y="694" font-size="12" fill="#333">= À implémenter</text>
</svg>
