<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Architecture Finale — Saham Bank</title>
<style>
body { margin: 0; background: #0f172a; display: flex; justify-content: center; padding: 20px; font-family: 'Segoe UI', sans-serif; }
svg { max-width: 1200px; width: 100%; height: auto; }
</style>
</head>
<body>
<svg viewBox="0 0 1200 900" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="sh"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.25"/></filter>
    <filter id="shl"><feDropShadow dx="0" dy="3" stdDeviation="6" flood-opacity="0.3"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#94a3b8"/>
    </marker>
    <marker id="arrow-gold" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#f59e0b"/>
    </marker>
    <linearGradient id="g-bronze" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8B4513"/>
      <stop offset="100%" stop-color="#A0522D"/>
    </linearGradient>
    <linearGradient id="g-silver" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#64748b"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
    <linearGradient id="g-gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>
    <linearGradient id="g-api" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0D9488"/>
      <stop offset="100%" stop-color="#0F766E"/>
    </linearGradient>
  </defs>

  <!-- Fond -->
  <rect x="0" y="0" width="1200" height="900" rx="12" fill="#1e293b"/>
  <rect x="15" y="15" width="1170" height="870" rx="8" fill="none" stroke="#334155" stroke-width="1"/>

  <!-- Titre -->
  <text x="600" y="50" font-size="22" font-weight="700" fill="#f1f5f9" text-anchor="middle" letter-spacing="2">ARCHITECTURE FINALE — SAHAM BANK ANALYTICS PORTAL</text>
  <line x1="200" y1="65" x2="1000" y2="65" stroke="#334155" stroke-width="1"/>

  <!-- ════════ SOURCE ════════ -->
  <rect x="60" y="85" width="200" height="60" rx="8" fill="#2d3748" stroke="#4a5568" stroke-width="1.5" filter="url(#sh)"/>
  <text x="160" y="110" font-size="14" font-weight="700" fill="#e2e8f0" text-anchor="middle">Fichiers CSV</text>
  <text x="160" y="130" font-size="11" fill="#94a3b8" text-anchor="middle">etl/data/*.csv</text>

  <!-- ════════ BRONZE ════════ -->
  <rect x="340" y="85" width="200" height="60" rx="8" fill="url(#g-bronze)" filter="url(#sh)"/>
  <text x="440" y="110" font-size="14" font-weight="700" fill="#fef3c7" text-anchor="middle">BRONZE</text>
  <text x="440" y="130" font-size="11" fill="#fde68a" text-anchor="middle">Tables bronze_* (copie brute)</text>

  <line x1="260" y1="115" x2="335" y2="115" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="298" y="108" font-size="10" fill="#94a3b8" text-anchor="middle">INSERT</text>

  <!-- ════════ SILVER ════════ -->
  <rect x="340" y="175" width="200" height="60" rx="8" fill="url(#g-silver)" filter="url(#sh)"/>
  <text x="440" y="200" font-size="14" font-weight="700" fill="#f1f5f9" text-anchor="middle">SILVER</text>
  <text x="440" y="220" font-size="11" fill="#cbd5e1" text-anchor="middle">Tables silver_* (validees)</text>

  <line x1="440" y1="145" x2="440" y2="170" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="455" y="160" font-size="10" fill="#94a3b8" text-anchor="middle">validation</text>

  <!-- ════════ GOLD ════════ -->
  <rect x="340" y="265" width="200" height="60" rx="8" fill="url(#g-gold)" filter="url(#sh)"/>
  <text x="440" y="290" font-size="14" font-weight="700" fill="#fef3c7" text-anchor="middle">GOLD (Data Mart)</text>
  <text x="440" y="310" font-size="11" fill="#fde68a" text-anchor="middle">dim_* + fact_* + KPIs</text>

  <line x1="440" y1="235" x2="440" y2="260" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="455" y="250" font-size="10" fill="#94a3b8" text-anchor="middle">nettoyage</text>

  <!-- ════════ ORCHESTRATEUR ════════ -->
  <rect x="600" y="85" width="200" height="60" rx="8" fill="#1e3a5f" stroke="#3b82f6" stroke-width="1.5" filter="url(#sh)"/>
  <text x="700" y="110" font-size="14" font-weight="700" fill="#93c5fd" text-anchor="middle">ORCHESTRATEUR</text>
  <text x="700" y="130" font-size="11" fill="#94a3b8" text-anchor="middle">etl_pipeline.py</text>

  <line x1="800" y1="115" x2="620" y2="195" stroke="#3b82f6" stroke-width="1" stroke-dasharray="4,3"/>

  <!-- ════════ DATA QUALITY ════════ -->
  <rect x="860" y="85" width="200" height="60" rx="8" fill="#3b1a1a" stroke="#ef4444" stroke-width="1.5" filter="url(#sh)"/>
  <text x="960" y="110" font-size="14" font-weight="700" fill="#fca5a5" text-anchor="middle">DATA QUALITY</text>
  <text x="960" y="130" font-size="11" fill="#94a3b8" text-anchor="middle">data_quality.py</text>

  <line x1="540" y1="115" x2="855" y2="115" stroke="#ef4444" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

  <!-- ════════ SECTION : COUCHE API ════════ -->
  <line x1="60" y1="360" x2="1140" y2="360" stroke="#334155" stroke-width="1.5"/>
  <text x="600" y="380" font-size="14" font-weight="700" fill="#f1f5f9" text-anchor="middle" letter-spacing="1">COUCHE API ET PRESENTATION</text>
  <line x1="200" y1="390" x2="1000" y2="390" stroke="#334155" stroke-width="1"/>

  <!-- ════════ PostgreSQL ════════ -->
  <rect x="340" y="410" width="200" height="70" rx="8" fill="#1e3a5f" stroke="#3b82f6" stroke-width="1.5" filter="url(#shl)"/>
  <text x="440" y="435" font-size="14" font-weight="700" fill="#93c5fd" text-anchor="middle">PostgreSQL</text>
  <text x="440" y="455" font-size="11" fill="#94a3b8" text-anchor="middle">saham_bank</text>
  <text x="440" y="470" font-size="10" fill="#64748b" text-anchor="middle">port 5432</text>

  <!-- Lien Gold → PostgreSQL -->
  <line x1="440" y1="325" x2="440" y2="405" stroke="#f59e0b" stroke-width="1.5" marker-end="url(#arrow-gold)"/>

  <!-- ════════ API ════════ -->
  <rect x="600" y="410" width="200" height="70" rx="8" fill="url(#g-api)" filter="url(#shl)"/>
  <text x="700" y="435" font-size="14" font-weight="700" fill="#f0fdfa" text-anchor="middle">FastAPI Backend</text>
  <text x="700" y="455" font-size="11" fill="#ccfbf1" text-anchor="middle">22 endpoints REST</text>
  <text x="700" y="470" font-size="10" fill="#5eead4" text-anchor="middle">port 8000</text>

  <line x1="540" y1="445" x2="595" y2="445" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="568" y="438" font-size="10" fill="#94a3b8" text-anchor="middle">SQL</text>

  <!-- ════════ FRONTEND ════════ -->
  <rect x="860" y="410" width="200" height="70" rx="8" fill="#2d3748" stroke="#6366f1" stroke-width="1.5" filter="url(#shl)"/>
  <text x="960" y="435" font-size="14" font-weight="700" fill="#a5b4fc" text-anchor="middle">React Frontend</text>
  <text x="960" y="455" font-size="11" fill="#94a3b8" text-anchor="middle">saham-bank-analytics-portal</text>
  <text x="960" y="470" font-size="10" fill="#64748b" text-anchor="middle">port 3000</text>

  <line x1="800" y1="445" x2="855" y2="445" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="828" y="438" font-size="10" fill="#94a3b8" text-anchor="middle">HTTP</text>

  <!-- ════════ CHATBOT IA ════════ -->
  <rect x="340" y="520" width="300" height="70" rx="8" fill="#2d1b4e" stroke="#8b5cf6" stroke-width="1.5" filter="url(#shl)"/>
  <text x="490" y="545" font-size="14" font-weight="700" fill="#c4b5fd" text-anchor="middle">Assistant IA (Equipe AI)</text>
  <text x="490" y="565" font-size="11" fill="#94a3b8" text-anchor="middle">Chatbot qui repond aux questions metier</text>
  <text x="490" y="580" font-size="10" fill="#64748b" text-anchor="middle">Consomme l'API REST</text>

  <line x1="700" y1="480" x2="600" y2="520" stroke="#8b5cf6" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrow)"/>
  <text x="620" y="505" font-size="10" fill="#8b5cf6" text-anchor="middle">API</text>

  <line x1="490" y1="590" x2="440" y2="485" stroke="#8b5cf6" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrow)"/>
  <text x="540" y="545" font-size="10" fill="#8b5cf6" text-anchor="middle">SQL direct</text>

  <!-- ════════ TOI vs IA ════════ -->
  <rect x="60" y="410" width="200" height="100" rx="8" fill="#1a2e1a" stroke="#22c55e" stroke-width="1.5" filter="url(#sh)"/>
  <text x="160" y="435" font-size="14" font-weight="700" fill="#86efac" text-anchor="middle">CE QUE TU FAIS</text>
  <line x1="80" y1="448" x2="240" y2="448" stroke="#22c55e" stroke-width="0.5"/>
  <text x="160" y="465" font-size="11" fill="#94a3b8" text-anchor="middle">- Generation CSV (fait)</text>
  <text x="160" y="480" font-size="11" fill="#94a3b8" text-anchor="middle">- Pipeline ETL Bronze/Silver/Gold</text>
  <text x="160" y="495" font-size="11" fill="#94a3b8" text-anchor="middle">- Data Quality</text>

  <rect x="60" y="530" width="200" height="60" rx="8" fill="#1a1e2e" stroke="#6366f1" stroke-width="1.5" filter="url(#sh)"/>
  <text x="160" y="555" font-size="14" font-weight="700" fill="#a5b4fc" text-anchor="middle">CE QUE L'IA A FAIT</text>
  <line x1="80" y1="568" x2="240" y2="568" stroke="#6366f1" stroke-width="0.5"/>
  <text x="160" y="582" font-size="11" fill="#94a3b8" text-anchor="middle">Backend API + securite + modeles</text>

  <!-- ════════ LÉGENDE ════════ -->
  <rect x="60" y="630" width="1080" height="100" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="600" y="655" font-size="12" font-weight="700" fill="#f1f5f9" text-anchor="middle">LEGENDE</text>
  <line x1="200" y1="662" x2="1000" y2="662" stroke="#334155" stroke-width="0.5"/>

  <rect x="100" y="675" width="18" height="18" rx="3" fill="url(#g-bronze)"/>
  <text x="125" y="689" font-size="11" fill="#94a3b8">Bronze (copie brute des CSV)</text>

  <rect x="340" y="675" width="18" height="18" rx="3" fill="url(#g-silver)"/>
  <text x="365" y="689" font-size="11" fill="#94a3b8">Silver (donnees validees et nettoyees)</text>

  <rect x="600" y="675" width="18" height="18" rx="3" fill="url(#g-gold)"/>
  <text x="625" y="689" font-size="11" fill="#94a3b8">Gold (dimensions, faits, KPIs)</text>

  <rect x="860" y="675" width="18" height="18" rx="3" fill="url(#g-api)"/>
  <text x="885" y="689" font-size="11" fill="#94a3b8">API FastAPI</text>

  <text x="100" y="715" font-size="10" fill="#64748b">Les tables API (clients, agences, engagements) sont remplies a partir de Gold. Le chatbot IA peut lire les donnees via l'API ou directement en SQL.</text>

  <!-- ════════ FLUX ════════ -->
  <rect x="60" y="760" width="1080" height="110" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1" stroke-dasharray="4,2"/>
  <text x="600" y="785" font-size="12" font-weight="700" fill="#f1f5f9" text-anchor="middle">FLUX COMPLET (lecture de gauche a droite)</text>
  <text x="600" y="810" font-size="11" fill="#94a3b8" text-anchor="middle">1. Tu generes les CSV avec generate_data.py</text>
  <text x="600" y="828" font-size="11" fill="#94a3b8" text-anchor="middle">2. Le pipeline ETL lit les CSV → bronze → silver → gold → tables API</text>
  <text x="600" y="846" font-size="11" fill="#94a3b8" text-anchor="middle">3. Le frontend React et le chatbot IA consomment l'API pour afficher/repondre</text>
  <text x="600" y="864" font-size="10" fill="#64748b" text-anchor="middle">Tout tourne sur le meme serveur PostgreSQL (saham_bank, port 5432)</text>
</svg>
</body>
</html>
