services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: saham_bank
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgre_abdel}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d saham_bank"]
      interval: 5s
      timeout: 5s
      retries: 12

  api:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-postgre_abdel}@db:5432/saham_bank
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: saham_bank
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgre_abdel}
      DB_HOST: db
      DB_PORT: 5432
      SECRET_KEY: ${SECRET_KEY:-dev-secret-key-change-me}
      OAUTH_CLIENT_ID: client_id
      OAUTH_CLIENT_SECRET: client_secret
      OAUTH_REDIRECT_URI: http://localhost:3000/callback
      LOG_LEVEL: INFO
      LOG_FILE: app.log
      RATE_LIMIT_PER_MINUTE: 60
      LLM_PROVIDER: mock
      GROQ_API_KEY: ""
      GROQ_MODEL: llama-3.3-70b-versatile
      OLLAMA_BASE_URL: http://localhost:11434
      OLLAMA_MODEL: llama3.2:3b
      EMBEDDING_MODEL: sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2
      EMBEDDING_DIM: 384
      AI_TOP_K: 4
      SQL_MAX_ROWS: 100
      ETL_SCHEDULER_ENABLED: ${ETL_SCHEDULER_ENABLED:-false}
      ETL_SCHEDULE_HOUR: ${ETL_SCHEDULE_HOUR:-2}
      CORS_ORIGINS: "http://localhost:3000,http://127.0.0.1:3000,http://localhost:5500,http://127.0.0.1:5500,http://localhost:8000"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)\""]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 60s

  web:
    build:
      context: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - api

volumes:
  pgdata:
