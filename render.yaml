services:
  - type: web
    name: saham-bank-api
    env: python
    region: frankfurt
    plan: free
    branch: main
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        sync: false   # a saisir dans le tableau de bord Render
      - key: SECRET_KEY
        sync: false   # a saisir dans le tableau de bord Render
      - key: LLM_PROVIDER
        value: mock
      - key: CORS_ORIGINS
        value: "*"
