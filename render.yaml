# Configuration de déploiement Render (Infrastructure as Code)
# Permet de déployer automatiquement le backend FastAPI sur Render.
services:
  - type: web
    name: saham-bank-api
    env: docker
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    plan: free
    region: frankfurt
    envVars:
      - key: DATABASE_URL
        sync: false # À renseigner avec l'URL PostgreSQL Neon (ex: postgresql://user:pass@ep-xyz.eu-central-1.aws.neon.tech/saham_bank?sslmode=require)
      - key: SECRET_KEY
        generateValue: true
      - key: LLM_PROVIDER
        value: groq
      - key: GROQ_API_KEY
        sync: false # Optionnel : renseigner si vous avez une clé Groq
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile
      - key: CORS_ORIGINS
        value: "http://localhost:3000,http://localhost:5500,https://saham-portal.vercel.app,*"
